name: RandomSpawn
version: 1.1.0
main: wolfcraft.randomspawn.RandomSpawn
api-version: 1.21
description: A plugin to randomly spawn players on join and respawn
folia-supported: true
commands:
  rd:
    description: RandomSpawn main command
    usage: /rd [reload|status|cache clear]
    aliases: [random, randomspawn]
permissions:
  randomspawn.reload:
    description: Permission to reload the plugin
    default: op
  randomspawn.manage:
    description: Permission to manage the spawn cache
    default: op
